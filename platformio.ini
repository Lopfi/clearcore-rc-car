; ClearCore RC car - PlatformIO project
;
; PlatformIO has no official ClearCore support yet. Board support lives in a
; community fork of platform-atmelsam (open PR #215 upstream). It pulls in a
; fork of Teknic's official ClearCore-Arduino-wrapper that ships with the
; prebuilt libClearCore + LwIP libraries.

[platformio]
default_envs = clearcore

[env]
; pinned to a known commit so builds stay reproducible
platform = https://github.com/patrickwasp/platform-atmelsam.git#c43ec8b722b56a5e27d2f058353aec74fb522f4c
board = clearcore
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    ; Override settings from include/config.h here if you like, e.g.
    ; -D RC_PROTOCOL=RC_PROTOCOL_IBUS
    ; -D MOTOR_TYPE=MOTOR_TYPE_PWM_DIR

; Default: uses the ClearCore Arduino wrapper bundled with the fork (1.1.x).
[env:clearcore]
build_src_filter = +<*> -<diag/>
; upload_port = /dev/ttyACM0

; Diagnostic: dumps raw bytes from the receiver (src/diag/sniffer.cpp)
;   pio run -e sniffer -t upload && pio device monitor
[env:sniffer]
build_src_filter = +<diag/>

; Optional: same board support, but with Teknic's latest official release
; (1.7.4 at the time of writing). See README.md, section
; "Using the latest official Teknic library". Untested - may need tweaks.
;[env:clearcore_official]
;platform_packages =
;    framework-arduino-samd-clearcore @ symlink://C:/dev/clearcore/ClearCore-1.7.4
